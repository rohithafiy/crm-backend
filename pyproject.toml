[project]
name = "lti-hub-backend"
version = "0.1.0"
description = "LTI Hub Backend - Multi-portal CRM backend with auth, authorization, and RBAC"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "pymongo>=4.6.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "python-dotenv>=1.0.0",
    "flask-cors>=4.0.0",
    "requests>=2.31.0",
    "cloudinary>=1.36.0",
    "gunicorn>=21.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pytest-env>=1.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
